services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saas_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: >
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c listen_addresses='*'
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - saas_network

  postgres-replica-1:
    image: postgres:15
    container_name: postgres-replica-1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do sleep 1; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*
        PGPASSWORD=postgres pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -vP -R
      fi;
      docker-entrypoint.sh postgres
      "
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary
    volumes:
      - replica_1_data:/var/lib/postgresql/data
    networks:
      - saas_network

  postgres-replica-2:
    image: postgres:15
    container_name: postgres-replica-2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do sleep 1; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*
        PGPASSWORD=postgres pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -vP -R
      fi;
      docker-entrypoint.sh postgres
      "
    ports:
      - "5434:5432"
    depends_on:
      - postgres-primary
    volumes:
      - replica_2_data:/var/lib/postgresql/data
    networks:
      - saas_network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongosecret
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - saas_network

  api:
    build: ./app
    container_name: fastapi-app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./uploads:/uploads
    environment:
      - DATABASE_URL_PRIMARY=postgresql://postgres:postgres@postgres-primary:5432/saas_db
      - DATABASE_URL_REPLICA_1=postgresql://postgres:postgres@postgres-replica-1:5432/saas_db
      - DATABASE_URL_REPLICA_2=postgresql://postgres:postgres@postgres-replica-2:5432/saas_db
      - MONGODB_URL=mongodb://mongoadmin:mongosecret@mongodb:27017
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_API_KEY_HERE}
    depends_on:
      - postgres-primary
      - mongodb
    networks:
      - saas_network

volumes:
  primary_data:
  replica_1_data:
  replica_2_data:
  mongodb_data:

networks:
  saas_network:
    driver: bridge
