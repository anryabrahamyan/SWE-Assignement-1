services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saas_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: >
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c listen_addresses='*'
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql
      # Mount the new script to open up replication connections
      - ./init-hba.sh:/docker-entrypoint-initdb.d/20-init-hba.sh
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d saas_db -c 'SELECT 1 FROM image_jobs LIMIT 1'"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - saas_network

  postgres-replica-1:
    image: postgres:15
    container_name: postgres-replica-1
    user: postgres
    environment:
      - PGPASSWORD=postgres
    command: |
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do sleep 1; done;
      if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
        echo 'Cloning primary...'
        rm -rf /var/lib/postgresql/data/{*,.*} 2>/dev/null || true
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -R -X stream
      fi;
      chmod 700 /var/lib/postgresql/data
      exec postgres -c listen_addresses='*' -c hot_standby=on
      "
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - replica_1_data:/var/lib/postgresql/data
    networks:
      - saas_network

  postgres-replica-2:
    image: postgres:15
    container_name: postgres-replica-2
    user: postgres
    environment:
      - PGPASSWORD=postgres
    command: |
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do sleep 1; done;
      if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
        echo 'Cloning primary...'
        rm -rf /var/lib/postgresql/data/{*,.*} 2>/dev/null || true
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -R -X stream
      fi;
      chmod 700 /var/lib/postgresql/data
      exec postgres -c listen_addresses='*' -c hot_standby=on
      "
    ports:
      - "5434:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - replica_2_data:/var/lib/postgresql/data
    networks:
      - saas_network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongosecret
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - saas_network

  api:
    build: ./app
    container_name: fastapi-app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./uploads:/uploads
    environment:
      - DATABASE_URL_PRIMARY=postgresql://postgres:postgres@postgres-primary:5432/saas_db
      - DATABASE_URL_REPLICA_1=postgresql://postgres:postgres@postgres-replica-1:5432/saas_db
      - DATABASE_URL_REPLICA_2=postgresql://postgres:postgres@postgres-replica-2:5432/saas_db
      - MONGODB_URL=mongodb://mongoadmin:mongosecret@mongodb:27017
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_API_KEY_HERE}
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_started
      postgres-replica-2:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - saas_network

volumes:
  primary_data:
  replica_1_data:
  replica_2_data:
  mongodb_data:

networks:
  saas_network:
    driver: bridge